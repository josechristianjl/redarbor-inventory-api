name: redarbor-inventory

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
    ports:
      - "127.0.0.1:${SQL_SERVER_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD"
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -b -Q "SELECT 1"
          -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
      SQL_SERVER_PASSWORD: "${SQL_SERVER_PASSWORD:?SQL_SERVER_PASSWORD is required}"
    volumes:
      - ./database:/database:ro
    entrypoint:
      - /bin/bash
      - /database/init.sh
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}"
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8081}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "true"
      KEYCLOAK_SERVICE_CLIENT_SECRET: "${KEYCLOAK_SERVICE_CLIENT_SECRET:?KEYCLOAK_SERVICE_CLIENT_SECRET is required}"
      KEYCLOAK_DEMO_USER_PASSWORD: "${KEYCLOAK_DEMO_USER_PASSWORD:?KEYCLOAK_DEMO_USER_PASSWORD is required}"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infrastructure/keycloak/inventory-realm.json:/opt/keycloak/data/import/inventory-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  api:
    image: redarbor-inventory-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      API_ENABLE_HTTPS_REDIRECTION: "false"
      SQL_SERVER_HOST: sqlserver
      SQL_SERVER_PORT: "1433"
      SQL_SERVER_DATABASE: InventoryManagement
      SQL_SERVER_USER: inventory_app
      SQL_SERVER_PASSWORD: "${SQL_SERVER_PASSWORD:?SQL_SERVER_PASSWORD is required}"
      SQL_SERVER_TRUST_SERVER_CERTIFICATE: "${SQL_SERVER_TRUST_SERVER_CERTIFICATE:-true}"
      KEYCLOAK_AUTHORITY: "${KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/inventory}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://localhost:8081/realms/inventory}"
      KEYCLOAK_AUDIENCE: "${KEYCLOAK_AUDIENCE:-inventory-api}"
      KEYCLOAK_SWAGGER_CLIENT_ID: "${KEYCLOAK_SWAGGER_CLIENT_ID:-inventory-swagger}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "8"
        - http://localhost:8080/health/ready
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

volumes:
  sqlserver-data:
  keycloak-data:
